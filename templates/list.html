<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{{ lst.name }}</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh;direction:rtl}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at 20% 10%,#1a2744,transparent 50%),radial-gradient(ellipse at 80% 90%,#0d2235,transparent 50%);pointer-events:none}
.topbar{position:sticky;top:0;z-index:100;background:rgba(15,17,23,.92);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06);padding:0 14px;height:56px;display:flex;align-items:center;gap:9px}
.back{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.55);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;text-decoration:none;flex-shrink:0}
.ttl{font-size:15px;font-weight:700;color:#fff;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbadge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.r-admin{background:rgba(251,191,36,.12);color:#fbbf24;border:1px solid rgba(251,191,36,.2)}
.r-user{background:rgba(59,130,246,.12);color:#93c5fd;border:1px solid rgba(59,130,246,.2)}
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:8px;border:none;font-family:'Heebo',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all .14s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff}
.btn-primary:hover{box-shadow:0 3px 10px rgba(59,130,246,.4)}
.btn-ghost{background:rgba(255,255,255,.06);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.08)}
.btn-ghost:hover{background:rgba(255,255,255,.1)}
.btn-amber{background:rgba(251,191,36,.12);color:#fbbf24;border:1px solid rgba(251,191,36,.2)}
.btn-amber:hover{background:rgba(251,191,36,.22)}
.btn-green{background:rgba(34,197,94,.12);color:#86efac;border:1px solid rgba(34,197,94,.2)}
.btn-green:hover{background:rgba(34,197,94,.22)}
.btn-danger{background:rgba(239,68,68,.1);color:#fca5a5;border:1px solid rgba(239,68,68,.15)}
.btn-sm{padding:4px 9px;font-size:10px}
main{position:relative;z-index:1;padding:16px 12px;max-width:1400px;margin:0 auto}
/* Tabs */
.tabs{display:flex;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 15px;font-size:12px;font-weight:600;color:rgba(255,255,255,.35);cursor:pointer;border-bottom:2px solid transparent;transition:all .16s;white-space:nowrap;display:flex;align-items:center;gap:4px;flex-shrink:0}
.tab:hover{color:rgba(255,255,255,.6)}
.tab.on{color:#3b82f6;border-bottom-color:#3b82f6}
.tab-amber.on{color:#fbbf24;border-bottom-color:#fbbf24}
.tab-green.on{color:#86efac;border-bottom-color:#86efac}
.tab-red.on{color:#fca5a5;border-bottom-color:#ef4444}
.tab-car.on{color:#86efac;border-bottom-color:#86efac}
.err-badge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;border-radius:8px;background:#ef4444;color:#fff;font-size:9px;font-weight:700;padding:0 4px}
/* Table */
.tbar{display:flex;align-items:center;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.srch{flex:1;min-width:120px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:7px 11px;color:#fff;font-size:12px;font-family:'Heebo',sans-serif;outline:none;direction:rtl}
.srch:focus{border-color:rgba(59,130,246,.4)}
.srch::placeholder{color:rgba(255,255,255,.2)}
.sel-bar{display:none;align-items:center;gap:10px;background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.18);border-radius:9px;padding:7px 12px;margin-bottom:8px;font-size:12px;color:#93c5fd}
.sel-bar.show{display:flex}
.twrap{overflow-x:auto;border-radius:12px;border:1px solid rgba(255,255,255,.06)}
table{width:100%;border-collapse:collapse;min-width:500px}
thead{background:rgba(255,255,255,.035)}
th{padding:9px 10px;text-align:right;font-size:10px;font-weight:700;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:rgba(255,255,255,.6)}
th.cb-th{width:32px;padding-right:8px}
td{padding:8px 10px;font-size:12px;border-top:1px solid rgba(255,255,255,.04);vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.013)}
tr.conf-row td{background:rgba(34,197,94,.022)}
tr.err-row td{background:rgba(239,68,68,.07)!important}
tr.warn-row td{background:rgba(251,191,36,.05)!important}
.row-cb{width:14px;height:14px;cursor:pointer;accent-color:#3b82f6}
.ci{background:transparent;border:none;color:#e2e8f0;font-size:12px;font-family:'Heebo',sans-serif;width:100%;outline:none;direction:rtl;min-width:55px}
.ci:focus{background:rgba(59,130,246,.08);border-radius:4px;padding:2px 4px;margin:-2px -4px}
.ci.ro{color:rgba(255,255,255,.28);cursor:not-allowed}
.cs{background:transparent;border:none;color:#e2e8f0;font-size:12px;font-family:'Heebo',sans-serif;outline:none;cursor:pointer;direction:rtl;max-width:105px}
.cs option{background:#1a1d27}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.b-g{background:rgba(34,197,94,.13);color:#86efac}.b-r{background:rgba(239,68,68,.13);color:#fca5a5}
.b-y{background:rgba(234,179,8,.13);color:#fde68a}.b-b{background:rgba(59,130,246,.13);color:#93c5fd}
.b-x{background:rgba(255,255,255,.07);color:rgba(255,255,255,.4)}
.auto-val{font-size:11px;color:#86efac;font-weight:600}
.cfm-btn{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:rgba(255,255,255,.35);font-size:11px;font-weight:600;cursor:pointer;transition:all .16s;white-space:nowrap;font-family:'Heebo',sans-serif}
.cfm-btn:hover{border-color:rgba(34,197,94,.35);color:#86efac;background:rgba(34,197,94,.07)}
.cfm-btn.cfmd{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3);color:#86efac}
.del-btn{width:22px;height:22px;border-radius:5px;border:none;background:transparent;color:rgba(255,255,255,.18);cursor:pointer;font-size:12px;transition:all .14s;opacity:0}
tr:hover .del-btn{opacity:1}
.del-btn:hover{background:rgba(239,68,68,.14);color:#fca5a5}
.tfoot{padding:8px 11px;border-top:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:7px}
.add-btn{display:flex;align-items:center;gap:4px;font-size:12px;color:rgba(255,255,255,.3);cursor:pointer;background:none;border:none;font-family:'Heebo',sans-serif;font-weight:600;padding:3px 6px;border-radius:6px;transition:all .16s}
.add-btn:hover{color:#3b82f6;background:rgba(59,130,246,.07)}
.rowcount{font-size:11px;color:rgba(255,255,255,.16);margin-right:auto}
/* Errors tab */
.err-wrap{padding:4px 0}
.err-item{background:rgba(255,255,255,.03);border-radius:12px;padding:14px 16px;margin-bottom:10px;border:1px solid rgba(255,255,255,.07)}
.err-item.sev-error{border-color:rgba(239,68,68,.22);background:rgba(239,68,68,.05)}
.err-item.sev-warning{border-color:rgba(251,191,36,.18);background:rgba(251,191,36,.04)}
.err-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.err-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.err-msg{flex:1;font-size:13px;color:#e2e8f0;font-weight:500;line-height:1.5}
.err-actions{display:flex;gap:7px;flex-wrap:wrap}
.fix-panel{margin-top:10px;background:rgba(0,0,0,.2);border-radius:9px;padding:12px 14px;display:none}
.fix-panel.show{display:block}
.fix-panel label{display:block;font-size:11px;color:rgba(255,255,255,.4);margin-bottom:6px;font-weight:600}
.fix-panel input{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:8px 11px;color:#fff;font-size:12px;font-family:'Heebo',sans-serif;outline:none;direction:rtl}
.fix-panel input:focus{border-color:rgba(34,197,94,.4)}
.candidates{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.cand-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:3px 10px;font-size:11px;color:#e2e8f0;cursor:pointer;font-family:'Heebo',sans-serif;transition:all .14s}
.cand-btn:hover{background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.3);color:#93c5fd}
.fix-result{font-size:12px;color:#86efac;margin-top:8px;display:none}
.err-ok{background:rgba(34,197,94,.07);border:1px solid rgba(34,197,94,.15);border-radius:10px;padding:12px 16px;font-size:12px;color:#86efac;display:flex;align-items:center;gap:8px}
/* Admin panel */
.apanel{background:rgba(251,191,36,.04);border:1px solid rgba(251,191,36,.12);border-radius:12px;padding:18px;margin-bottom:14px}
.apanel h4{font-size:13px;font-weight:700;color:#fbbf24;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.psec h5{font-size:10px;font-weight:700;color:rgba(255,255,255,.38);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.tag-list{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px;min-height:28px}
.tag{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:3px 10px;font-size:12px;color:#e2e8f0}
.tag button{background:none;border:none;color:rgba(255,255,255,.3);cursor:pointer;font-size:13px;padding:0;line-height:1}
.tag button:hover{color:#fca5a5}
.ti-row{display:flex;gap:6px}
.ti{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:7px 10px;color:#fff;font-size:12px;font-family:'Heebo',sans-serif;outline:none;direction:rtl}
.ti:focus{border-color:rgba(251,191,36,.4)}
.ni{width:60px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:7px 9px;color:#fff;font-size:14px;font-weight:700;text-align:center;font-family:'Heebo',sans-serif;outline:none}
.ni:focus{border-color:rgba(251,191,36,.4)}
.ni-label{font-size:11px;color:rgba(255,255,255,.35)}
.di{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 10px;color:#fff;font-size:12px;font-family:'Heebo',sans-serif;outline:none;direction:ltr}
.di:focus{border-color:rgba(251,191,36,.4)}
/* Car view */
.cv-dir-toggle{display:flex;gap:8px;margin-bottom:14px}
.cv-dir-btn{flex:1;padding:9px;border-radius:9px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:rgba(255,255,255,.45);font-size:13px;font-weight:600;cursor:pointer;font-family:'Heebo',sans-serif;transition:all .16s;text-align:center}
.cv-dir-btn.active{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.3);color:#86efac}
.cv-rec{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.18);border-radius:10px;padding:10px 14px;font-size:12px;color:#fca5a5;margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cv-ok{background:rgba(34,197,94,.07);border:1px solid rgba(34,197,94,.15);border-radius:10px;padding:10px 14px;font-size:12px;color:#86efac;margin-bottom:14px}
.cv-cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:18px}
.cv-car{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:13px;padding:14px;transition:border .18s}
.cv-car.has-driver{border-color:rgba(34,197,94,.25)}
.cv-car-title{font-size:13px;font-weight:700;color:#fff;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.cv-seats{display:flex;flex-direction:column;gap:5px}
.cv-seat{display:flex;align-items:center;gap:7px;padding:5px 9px;border-radius:7px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05);font-size:11px;color:#e2e8f0}
.cv-seat.driver{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.25);color:#86efac}
.cv-seat.empty{background:rgba(255,255,255,.02);border-color:rgba(255,255,255,.03);color:rgba(255,255,255,.2);font-style:italic}
.cv-seat .sname{flex:1}.cv-seat .dbadge{font-size:10px;background:rgba(34,197,94,.2);color:#86efac;border-radius:20px;padding:1px 7px;font-weight:700}
.md-btn{font-size:10px;background:none;border:1px solid rgba(255,255,255,.1);border-radius:6px;color:rgba(255,255,255,.3);cursor:pointer;padding:2px 7px;font-family:'Heebo',sans-serif;transition:all .14s;opacity:0;white-space:nowrap}
.cv-seat:hover .md-btn{opacity:1}
.md-btn:hover{border-color:rgba(34,197,94,.4);color:#86efac}
.cv-unassigned{background:rgba(251,191,36,.05);border:1px solid rgba(251,191,36,.15);border-radius:11px;padding:12px;margin-bottom:12px}
.cv-unassigned h4{font-size:11px;font-weight:700;color:#fbbf24;margin-bottom:7px}
.cv-tags{display:flex;flex-wrap:wrap;gap:5px}
.cv-ptag{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:2px 9px;font-size:11px;color:#e2e8f0}
/* Combined car view */
.cv-cars-combined{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-bottom:18px}
.cv-car-combined{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;transition:border .18s}
.cv-car-combined.has-driver{border-color:rgba(34,197,94,.28)}
.cv-car-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.cv-car-name{font-size:13px;font-weight:700;color:#fff}
.cv-driver-row{display:flex;align-items:center;gap:6px}
.cv-driver-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.22);border-radius:20px;padding:2px 9px;color:#86efac}
.cv-driver-badge .rm-drv{background:none;border:none;color:rgba(134,239,172,.5);cursor:pointer;font-size:13px;padding:0;line-height:1;font-family:'Heebo',sans-serif;transition:color .13s}
.cv-driver-badge .rm-drv:hover{color:#fca5a5}
.cv-add-driver{font-size:10px;background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.2);border-radius:20px;padding:2px 10px;color:rgba(255,255,255,.38);cursor:pointer;font-family:'Heebo',sans-serif;transition:all .14s}
.cv-add-driver:hover{border-color:rgba(34,197,94,.4);color:#86efac;background:rgba(34,197,94,.05)}
.cv-driver-inp{background:rgba(255,255,255,.07);border:1px solid rgba(34,197,94,.35);border-radius:20px;padding:2px 10px;color:#fff;font-size:11px;font-family:'Heebo',sans-serif;outline:none;direction:rtl;width:110px}
.cv-dirs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cv-dir-col{}
.cv-dir-label{font-size:10px;font-weight:700;color:rgba(255,255,255,.35);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;text-transform:uppercase;letter-spacing:.4px}
.cv-dir-count{background:rgba(255,255,255,.06);border-radius:10px;padding:1px 6px;font-size:10px}
.cv-date-badge{font-size:9px;background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.2);border-radius:8px;padding:1px 7px;color:#93c5fd;font-weight:700;letter-spacing:.2px}
@media(max-width:480px){.cv-dirs{grid-template-columns:1fr}.cv-cars-combined{grid-template-columns:1fr}}
/* changelog */
.assign-steps{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;padding:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:12px}
.btn-step{display:flex;align-items:center;gap:8px;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.25);border-radius:10px;padding:7px 13px;color:#93c5fd;cursor:pointer;font-family:'Heebo',sans-serif;font-size:12px;transition:all .15s;text-align:right}
.btn-step:hover{background:rgba(59,130,246,.22);border-color:rgba(59,130,246,.45)}
.btn-step .step-num{background:rgba(59,130,246,.3);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0}
.btn-step small{display:block;font-size:9px;color:rgba(255,255,255,.4);margin-top:1px}
.step-arrow{color:rgba(255,255,255,.2);font-size:16px}
.lw{padding:2px 0}.li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:flex-start}
.li:last-child{border:none}.ld{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:4px}
.d-e{background:#3b82f6}.d-c{background:#22c55e}.d-d{background:#ef4444}.d-a{background:#a855f7}.d-car{background:#fbbf24}
.lb{flex:1}.la{font-size:12px;color:#e2e8f0;font-weight:500}.ldt{font-size:11px;color:rgba(255,255,255,.28);margin-top:1px}
.lt{font-size:10px;color:rgba(255,255,255,.18);flex-shrink:0;white-space:nowrap}
/* modals */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.76);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:flex-start;justify-content:center;padding:14px;overflow-y:auto}
.mo.on{display:flex}
.md{background:#1a1d27;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:22px;width:100%;max-width:460px;box-shadow:0 40px 80px rgba(0,0,0,.6);margin:auto}
.md h3{font-size:15px;font-weight:700;color:#fff;margin-bottom:14px}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:10px;color:rgba(255,255,255,.38);margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg select{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:9px 11px;color:#fff;font-size:12px;font-family:'Heebo',sans-serif;outline:none;direction:rtl;transition:border .2s}
.fg input:focus,.fg select:focus{border-color:rgba(59,130,246,.5)}
.fg select option{background:#1a1d27}
.ma{display:flex;gap:7px;justify-content:flex-end;margin-top:14px}
.drop-zone{border:2px dashed rgba(255,255,255,.12);border-radius:12px;padding:24px 14px;text-align:center;cursor:pointer;transition:all .18s;color:rgba(255,255,255,.3);font-size:13px}
.drop-zone:hover,.drop-zone.drag-over{border-color:rgba(59,130,246,.4);background:rgba(59,130,246,.05);color:#93c5fd}
.drop-zone .dzi{font-size:28px;margin-bottom:6px;display:block}
.sheet-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:10px 13px;margin-bottom:7px;cursor:pointer;transition:all .16s}
.sheet-card:hover,.sheet-card.sel{border-color:rgba(59,130,246,.4);background:rgba(59,130,246,.07)}
.sheet-card h4{font-size:13px;font-weight:600;color:#fff;margin-bottom:3px}
.sheet-card p{font-size:11px;color:rgba(255,255,255,.35)}
.col-preview{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.col-chip{font-size:10px;background:rgba(255,255,255,.07);border-radius:5px;padding:1px 6px;color:rgba(255,255,255,.5)}
.info-box{background:rgba(34,197,94,.07);border:1px solid rgba(34,197,94,.15);border-radius:8px;padding:8px 11px;font-size:11px;color:rgba(134,239,172,.7);margin-bottom:10px;line-height:1.5}
@media(max-width:560px){main{padding:10px 6px}.tab{padding:8px 10px;font-size:11px}th,td{padding:7px 7px;font-size:11px}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="topbar">
  <a href="/" class="back">→</a>
  <div class="ttl">{{ lst.name }}</div>
  <span class="rbadge {{ 'r-admin' if is_admin else 'r-user' }}">{{ '👑 אדמין' if is_admin else '👤 '+username }}</span>
  {% if is_admin %}<button class="btn btn-primary" onclick="addRow()">+ שורה</button>{% endif %}
</div>
<main>
  <div class="tabs" id="tabsRow"></div>
  <div id="mainArea"></div>
</main>

<!-- Import Excel modal -->
<div class="mo" id="xlMo"><div class="md" style="max-width:500px">
  <h3>ייבא מ-Excel</h3>
  <div id="xlS1">
    <div class="info-box">💡 הכותרות צריכות להתאים לשמות העמודות ברשימה</div>
    <div class="drop-zone" id="xlDrop" onclick="document.getElementById('xlFile').click()"
         ondragover="xlDragOver(event)" ondragleave="xlDragLeave(event)" ondrop="xlDropped(event)">
      <span class="dzi">📊</span><strong>לחץ לבחור קובץ Excel</strong><br>
      <span style="font-size:11px">.xlsx, .xls</span>
    </div>
    <input type="file" id="xlFile" accept=".xlsx,.xls" style="display:none" onchange="xlFileChosen(this)">
  </div>
  <div id="xlS2" style="display:none">
    <div style="font-size:12px;color:rgba(255,255,255,.4);margin-bottom:10px" id="xlFName"></div>
    <div class="fg"><label>גיליון</label><div id="xlSheets"></div></div>
    <div id="xlColPrev" style="margin-top:7px"></div>
  </div>
  <div id="xlS3" style="display:none">
    <div class="info-box" id="xlResult"></div>
  </div>
  <div class="ma">
    <button class="btn btn-ghost" onclick="cl('xlMo')">סגור</button>
    <button class="btn btn-primary" id="xlBtn" onclick="xlImport()" style="display:none">📤 ייבא</button>
  </div>
</div></div>

<script>
const LID={{lst.id}}, IS_ADMIN={{('true' if is_admin else 'false')}}, USERNAME={{username|tojson}};
let lstConfig={{{'teams':lst.teams,'car_count':lst.car_count,'car_capacity':lst.car_capacity,'trial_start':lst.trial_start or '','trial_end':lst.trial_end or ''}|tojson}};
const ADMIN_ONLY=new Set(['מספר ת"ז']), AUTO_COLS=new Set(['רכב הלוך','רכב חזור']);
let rows=[], activeId='table', sortCol=null, sortDir=1, search='', selRows=new Set();
let currentIssues=[], currentRowIssues={};
let carViewDir='arrive', carViewData=null;

// ── INIT ───────────────────────────────────────────────────────────────────────
async function init(){
  await loadRows();
  renderTabs();
  renderTable();
}

async function loadRows(){
  const r=await fetch('/api/lists/'+LID+'/rows');
  rows=await r.json();
}

// ── TABS ───────────────────────────────────────────────────────────────────────
function renderTabs(){
  const row=document.getElementById('tabsRow'); row.innerHTML='';
  const tabs=[
    {id:'table',label:'📋 רשימה',cls:''},
    ...(IS_ADMIN?[{id:'admin',label:'⚙️ הגדרות',cls:' tab-amber'}]:[]),
    {id:'carview',label:'🚗 רכבים',cls:' tab-car'},
    {id:'errors',label:currentIssues.length?`⚠️ שגיאות <span class="err-badge">${currentIssues.length}</span>`:'⚠️ שגיאות',cls:' tab-red'},
    {id:'log',label:'📜 יומן',cls:' tab-green'},
  ];
  tabs.forEach(t=>{
    const el=document.createElement('div');
    el.className='tab'+t.cls+(activeId===t.id?' on':'');
    el.innerHTML=t.label; el.onclick=()=>switchTab(t.id);
    row.appendChild(el);
  });
}

function switchTab(id){
  activeId=id; renderTabs();
  if(id==='table') renderTable();
  else if(id==='admin') showAdmin();
  else if(id==='carview') showCarView();
  else if(id==='errors') showErrors();
  else if(id==='log') showLog();
}

// ── TABLE ──────────────────────────────────────────────────────────────────────
const COLS=[{name:'שם',type:'text'},{name:'שם משפחה',type:'text'},{name:'מספר ת"ז',type:'text',admin_only:true},{name:'צוות',type:'select',teams_col:true},{name:'תאריך הגעה',type:'date'},{name:'תאריך חזרה',type:'date'},{name:'אילוצים/הערות',type:'text'},{name:'רכב חברה',type:'status',options:'כן,לא'},{name:'רכב הלוך',type:'text',auto_col:true},{name:'רכב חזור',type:'text',auto_col:true},{name:'מספר חדר',type:'text'}];
const visCols=COLS.filter(c=>!ADMIN_ONLY.has(c.name)||IS_ADMIN);

function renderTable(){
  let filtered=rows;
  if(search){const s=search.toLowerCase();filtered=rows.filter(r=>Object.values(r.data).some(v=>String(v||'').toLowerCase().includes(s)));}
  if(sortCol) filtered=[...filtered].sort((a,b)=>String(a.data[sortCol]||'').localeCompare(String(b.data[sortCol]||''),'he')*sortDir);

  const area=document.getElementById('mainArea'); area.innerHTML='';

  // Toolbar
  const tb=document.createElement('div'); tb.className='tbar';
  tb.innerHTML=`<input class="srch" placeholder="🔍 חיפוש..." value="${search}" oninput="onSearch(this.value)">
    <button class="btn btn-ghost btn-sm" onclick="doExport()">📥 ייצא</button>
    ${IS_ADMIN?`<label class="btn btn-ghost btn-sm" style="cursor:pointer">📤 ייבא<input type="file" accept=".xlsx,.xls" style="display:none" onchange="quickImport(this)"></label>
    <button class="btn btn-amber btn-sm" onclick="setActiveTab('carview');showCarView()">🚗 רכבים</button>
    <button class="btn btn-primary btn-sm" onclick="addRow()">+ שורה</button>`:''}`;
  area.appendChild(tb);

  // Selection bar
  const sb=document.createElement('div'); sb.className='sel-bar'+(selRows.size>0?' show':''); sb.id='selBar';
  sb.innerHTML=`<span id="selCount">${selRows.size} נבחרו</span>
    <button class="btn btn-danger btn-sm" onclick="deleteSelected()">🗑 מחק</button>
    <button class="btn btn-ghost btn-sm" onclick="clearSel()">✕ בטל</button>`;
  area.appendChild(sb);

  const wrap=document.createElement('div'); wrap.className='twrap';
  let th='<tr>';
  if(IS_ADMIN) th+=`<th class="cb-th"><input type="checkbox" class="row-cb" id="cbAll" onclick="selAll(this)"></th>`;
  visCols.forEach(c=>{const arr=sortCol===c.name?(sortDir===1?' ↑':' ↓'):'';const lock=ADMIN_ONLY.has(c.name)?' 🔒':'';th+=`<th onclick="toggleSort('${esc(c.name)}')">${c.name}${lock}${arr}</th>`;});
  th+=`<th style="width:90px;text-align:center">אישור</th>${IS_ADMIN?'<th style="width:22px"></th>':''}</tr>`;

  let tb2='';
  if(!filtered.length){
    tb2=`<tr><td colspan="${visCols.length+1+(IS_ADMIN?2:0)}" style="text-align:center;padding:36px;color:rgba(255,255,255,.2)">אין שורות</td></tr>`;
  } else {
    filtered.forEach(row=>{
      const isConf=!!row.confirmed_by;
      const ri=currentRowIssues[String(row.id)]||[];
      const rc=ri.length&&!isConf?'err-row':(isConf?'conf-row':'');
      tb2+=`<tr class="${rc}" data-rid="${row.id}">`;
      if(IS_ADMIN) tb2+=`<td class="cb-th"><input type="checkbox" class="row-cb row-sel" data-rid="${row.id}" ${selRows.has(row.id)?'checked':''} onclick="onRowCb(this)"></td>`;
      visCols.forEach(col=>{tb2+=`<td>${renderCell(col,row.data[col.name]||'',row.id)}</td>`;});
      const ct=isConf?`✓ ${row.confirmed_by}`:'אשר';
      tb2+=`<td style="text-align:center"><button class="cfm-btn ${isConf?'cfmd':''}" onclick="cfmRow(${row.id},this)">${ct}</button></td>`;
      if(IS_ADMIN) tb2+=`<td><button class="del-btn" onclick="delRow(${row.id})">🗑</button></td>`;
      tb2+='</tr>';
    });
  }
  const conf=rows.filter(r=>r.confirmed_by).length;
  wrap.innerHTML=`<table><thead>${th}</thead><tbody id="tbody">${tb2}</tbody></table>
    <div class="tfoot">${IS_ADMIN?`<button class="add-btn" onclick="addRow()">+ הוסף שורה</button>`:''}<span class="rowcount">${filtered.length} שורות · ✅ ${conf}/${rows.length}</span></div>`;
  area.appendChild(wrap);
}

function renderCell(col,val,rowId){
  const ev=v=>String(v||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  if(col.type==='select'||col.type==='status'){
    let optsStr=col.teams_col?(lstConfig.teams||[]).join(','):(col.options||'');
    const opts=optsStr.split(',').map(o=>o.trim()).filter(Boolean);
    let html='';
    if(col.type==='status'&&val){
      let cls='b-x';const v=val.toLowerCase();
      if(['מאושר','כן','ok','v','✓','פעיל','קיים'].includes(v))cls='b-g';
      else if(['לא','בוטל','לא מאושר'].includes(v))cls='b-r';
      else if(['ממתין','בהמתנה'].includes(v))cls='b-y';
      else if(['מרחוק','חלקי'].includes(v))cls='b-b';
      html=`<span class="badge ${cls}">${ev(val)}</span> `;
    }
    let sel=`<select class="cs" onchange="updCell(${rowId},'${ev(col.name)}',this.value)"><option value="" ${!val?'selected':''}>—</option>`;
    opts.forEach(o=>sel+=`<option value="${ev(o)}" ${val===o?'selected':''}>${ev(o)}</option>`);
    return html+sel+'</select>';
  }
  if(col.type==='checkbox') return `<input type="checkbox" ${val?'checked':''} onchange="updCell(${rowId},'${ev(col.name)}',this.checked)" style="width:14px;height:14px;cursor:pointer">`;
  if(!IS_ADMIN&&AUTO_COLS.has(col.name)&&val) return `<span class="auto-val">🚗 ${ev(val)}</span>`;
  const ro=(!IS_ADMIN&&AUTO_COLS.has(col.name))?'readonly class="ci ro"':'class="ci"';
  return `<input ${ro} type="${col.type==='date'?'date':col.type==='number'?'number':'text'}" value="${ev(val)}" onchange="updCell(${rowId},'${ev(col.name)}',this.value)">`;
}

function esc(s){return String(s||'').replace(/'/g,"\\'")}
function onSearch(v){search=v;renderTable();}
function toggleSort(c){sortCol===c?sortDir*=-1:(sortCol=c,sortDir=1);renderTable();}

// ── ROW OPS ────────────────────────────────────────────────────────────────────
async function addRow(){
  const data={};COLS.forEach(c=>data[c.name]='');
  const r=await fetch('/api/lists/'+LID+'/rows',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  const j=await r.json();
  rows.push({id:j.id,data,confirmed_by:null});
  renderTable();
  setTimeout(()=>{const trs=document.querySelectorAll('#tbody tr');const last=trs[trs.length-1];if(last){const inp=last.querySelector('.ci,.cs');if(inp)inp.focus();}},50);
}

async function updCell(rowId,col,val){
  const row=rows.find(r=>r.id===rowId); if(!row)return;
  row.data[col]=val;
  await fetch('/api/rows/'+rowId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(row.data)});
}

async function cfmRow(rid,btn){
  const r=await fetch('/api/rows/'+rid+'/confirm',{method:'POST'});
  const j=await r.json();
  const row=rows.find(r=>r.id===rid); if(row) row.confirmed_by=j.confirmed?j.by:null;
  const tr=btn.closest('tr');
  if(j.confirmed){btn.className='cfm-btn cfmd';btn.textContent='✓ '+j.by;tr.classList.add('conf-row');tr.classList.remove('err-row');}
  else{btn.className='cfm-btn';btn.textContent='אשר';tr.classList.remove('conf-row');}
  const rc=document.querySelector('.rowcount');
  if(rc){const conf=rows.filter(r=>r.confirmed_by).length;rc.textContent=`${rows.length} שורות · ✅ ${conf}/${rows.length}`;}
}

async function delRow(rid){
  await fetch('/api/rows/'+rid,{method:'DELETE'});
  rows=rows.filter(r=>r.id!==rid); selRows.delete(rid); renderTable();
}

// Selection
function onRowCb(cb){const rid=parseInt(cb.dataset.rid);if(cb.checked)selRows.add(rid);else selRows.delete(rid);updateSelBar();}
function selAll(cb){const all=document.querySelectorAll('.row-sel');all.forEach(c=>{c.checked=cb.checked;const rid=parseInt(c.dataset.rid);cb.checked?selRows.add(rid):selRows.delete(rid);});updateSelBar();}
function updateSelBar(){const sb=document.getElementById('selBar');if(!sb)return;if(selRows.size>0){sb.classList.add('show');document.getElementById('selCount').textContent=selRows.size+' נבחרו';}else sb.classList.remove('show');}
function clearSel(){selRows.clear();renderTable();}
async function deleteSelected(){if(!selRows.size||!confirm(`למחוק ${selRows.size} שורות?`))return;const ids=[...selRows];const r=await fetch('/api/lists/'+LID+'/rows/bulk-delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids})});const j=await r.json();if(j.ok){rows=rows.filter(r=>!ids.includes(r.id));selRows.clear();renderTable();toast(`✅ נמחקו ${j.deleted} שורות`);}}

// Export / Import
function doExport(){window.location='/api/lists/'+LID+'/export';}
async function quickImport(inp){
  if(!inp.files||!inp.files[0])return;
  const form=new FormData();form.append('file',inp.files[0]);inp.value='';
  toast('⏳ מייבא...');
  const r=await fetch('/api/lists/'+LID+'/import',{method:'POST',body:form});
  const j=await r.json();
  if(j.ok){
    if(j.suggestions&&j.suggestions.applied){
      lstConfig.teams=j.suggestions.teams||lstConfig.teams;
      lstConfig.trial_start=j.suggestions.trial_start||lstConfig.trial_start;
      lstConfig.trial_end=j.suggestions.trial_end||lstConfig.trial_end;
      lstConfig.car_count=j.suggestions.car_count||lstConfig.car_count;
    }
    await loadRows(); renderTable();
    toast(`✅ יובאו ${j.imported} שורות${j.suggestions&&j.suggestions.new_teams&&j.suggestions.new_teams.length?' · קבוצות: '+j.suggestions.new_teams.join(', '):''}`);
  } else toast('❌ '+(j.error||'שגיאה'));
}

function toast(msg){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1d27;border:1px solid rgba(255,255,255,.15);border-radius:11px;padding:10px 18px;font-size:12px;color:#e2e8f0;z-index:9999;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:90vw;text-align:center';
  t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),4000);
}

// ── 3-STEP ASSIGNMENT ──────────────────────────────────────────────────────────
async function assignStep1(){
  if(!confirm('שלב 1: לאפס הכל ולשבץ מי שנוסע וחוזר באותם תאריכים?'))return;
  toast('⏳ מאפס ומשבץ...');
  const r=await fetch('/api/lists/'+LID+'/assign-step1',{method:'POST'});
  const j=await r.json();
  await loadRows(); await showCarView();
  if(j.ok){
    let msg=`✅ שיבוץ אחיד: ${j.assigned} אנשים ב-${j.cars_used} רכבים\n`;
    if(j.groups&&j.groups.length){
      j.groups.forEach(g=>{msg+=`\n📅 ${g.arr}→${g.ret}: ${g.names.join(', ')}`;});
    } else {
      msg+='\n⚠️ לא נמצאו קבוצות! לחץ 🔍 לבדיקת תאריכים';
    }
    if(j.ungrouped&&j.ungrouped.length)
      msg+=`\n\nללא שני תאריכים (שלב 2/3): ${j.ungrouped.join(', ')}`;
    toast(j.assigned>0?'✅ שיבוץ אחיד הושלם':'⚠️ לא שובץ כלום — בדוק תאריכים');
    alert(msg);
  }
}

async function assignStep2(){
  toast('⏳ משבץ הלוך...');
  const r=await fetch('/api/lists/'+LID+'/assign-step2',{method:'POST'});
  const j=await r.json();
  await loadRows(); await showCarView();
  if(j.ok){
    toast(`✅ שלב 2: ${j.assigned} אנשים שובצו להגעה`);
    if(j.still_unassigned&&j.still_unassigned.length)
      alert(`⚠️ ללא רכב הגעה (אין מקום): ${j.still_unassigned.join(', ')}`);
  }
}

async function assignStep3(){
  toast('⏳ משבץ חזור...');
  const r=await fetch('/api/lists/'+LID+'/assign-step3',{method:'POST'});
  const j=await r.json();
  await loadRows(); await showCarView();
  if(j.ok){ toast('✅ '+j.message); }
  else{
    let msg=`⚠️ ${j.stuck_count} אנשים ללא רכב חזרה:\n`;
    const byDate={};
    j.stuck.forEach(s=>{if(!byDate[s.return_date])byDate[s.return_date]=[];byDate[s.return_date].push(s.name);});
    Object.entries(byDate).forEach(([d,ns])=>{msg+=`\n📅 ${d}: ${ns.join(', ')}`;});
    msg+='\n\nנדרשת התערבות: הוסף/י רכב או שני/י תאריכים.';
    toast(`⚠️ ${j.stuck_count} ללא רכב חזרה`); alert(msg);
  }
}

async function assignReset(){
  if(!confirm('לאפס את כל שיבוצי הרכבים?'))return;
  const r=await fetch('/api/lists/'+LID+'/assign-reset',{method:'POST'});
  const j=await r.json();
  if(j.ok){await loadRows();await showCarView();toast('✅ שיבוצים אופסו');}
}

async function checkDates(){
  toast('⏳ בודק תאריכים...');
  const r=await fetch('/api/lists/'+LID+'/debug-dates');
  const j=await r.json();
  let msg=`📅 תאריכים (${j.count} אנשים):\n`;
  const groups={};
  j.people.forEach(p=>{
    const key=`${p.norm_arrival||'?'}→${p.norm_departure||'?'}`;
    if(!groups[key])groups[key]=[];
    groups[key].push(p.name);
  });
  Object.entries(groups).forEach(([k,ns])=>{msg+=`\n${k}: ${ns.join(', ')}`;});
  alert(msg);
}

// ── ADMIN PANEL ────────────────────────────────────────────────────────────────
let _teams=[...(lstConfig.teams||[])];
function showAdmin(){
  _teams=[...(lstConfig.teams||[])];
  document.getElementById('mainArea').innerHTML=`
  <div class="apanel">
    <h4>👑 הגדרות ${IS_ADMIN?'אדמין':''}</h4>
    <div class="pgrid">
      <div class="psec">
        <h5>צוותים</h5>
        <div class="tag-list" id="teamTags">${_teams.map(renderTag).join('')}</div>
        <div class="ti-row">
          <input class="ti" id="newTeam" placeholder="שם צוות..." onkeydown="if(event.key==='Enter')addTeam()">
          <button class="btn btn-ghost btn-sm" onclick="addTeam()">+ הוסף</button>
        </div>
      </div>
      <div class="psec">
        <h5>רכבים</h5>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <input class="ni" type="number" id="carCnt" value="${lstConfig.car_count}" min="1" max="30" oninput="updateCapSummary()">
          <span class="ni-label">רכבים</span>
          <input class="ni" type="number" id="carCap" value="${lstConfig.car_capacity}" min="1" max="20" oninput="updateCapSummary()">
          <span class="ni-label">מקומות</span>
        </div>
        <div style="font-size:11px;color:rgba(255,255,255,.28)" id="capSumm">סה"כ: ${lstConfig.car_count*lstConfig.car_capacity} מקומות</div>
      </div>
      <div class="psec">
        <h5>תקופת הניסוי</h5>
        <div style="display:flex;flex-direction:column;gap:6px">
          <input class="di" type="date" id="trialS" value="${lstConfig.trial_start||''}">
          <input class="di" type="date" id="trialE" value="${lstConfig.trial_end||''}">
        </div>
      </div>
    </div>
    <div style="margin-top:14px;display:flex;gap:8px;align-items:center">
      <button class="btn btn-amber" onclick="saveAdmin()">💾 שמור</button>
      <button class="btn btn-green" onclick="runValidation().then(()=>switchTab('errors'))">🔍 בדוק שגיאות</button>
      <span id="adminSaved" style="font-size:12px;color:#86efac;display:none">✅ נשמר!</span>
    </div>
  </div>`;
}

function renderTag(t){return `<span class="tag">${t}<button onclick="rmTeam('${t.replace(/'/g,"\\'")}')">×</button></span>`;}
function updateCapSummary(){const c=parseInt(document.getElementById('carCnt').value)||0,p=parseInt(document.getElementById('carCap').value)||0;document.getElementById('capSumm').textContent=`סה"כ: ${c*p} מקומות`;}
function addTeam(){const inp=document.getElementById('newTeam');const v=inp.value.trim();if(!v)return;if(!_teams.includes(v))_teams.push(v);inp.value='';document.getElementById('teamTags').innerHTML=_teams.map(renderTag).join('');}
function rmTeam(t){_teams=_teams.filter(x=>x!==t);document.getElementById('teamTags').innerHTML=_teams.map(renderTag).join('');}
async function saveAdmin(){
  lstConfig.teams=[..._teams];
  lstConfig.car_count=parseInt(document.getElementById('carCnt').value)||4;
  lstConfig.car_capacity=parseInt(document.getElementById('carCap').value)||3;
  lstConfig.trial_start=document.getElementById('trialS').value||'';
  lstConfig.trial_end=document.getElementById('trialE').value||'';
  await fetch('/api/lists/'+LID+'/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(lstConfig)});
  const s=document.getElementById('adminSaved');s.style.display='inline';setTimeout(()=>s.style.display='none',2500);
  await runValidation(); renderTabs();
}

// ── VALIDATION ─────────────────────────────────────────────────────────────────
async function runValidation(){
  const r=await fetch('/api/lists/'+LID+'/validate');
  const j=await r.json();
  currentIssues=j.issues||[]; currentRowIssues=j.row_issues||{};
  return j;
}

// ── ERRORS TAB ─────────────────────────────────────────────────────────────────
async function showErrors(){
  document.getElementById('mainArea').innerHTML='<div style="text-align:center;padding:30px;color:rgba(255,255,255,.3);font-size:12px">⏳ בודק...</div>';
  const j=await runValidation();
  renderTabs();
  const issues=j.issues||[];

  if(!issues.length){
    document.getElementById('mainArea').innerHTML='<div class="err-ok">✅ אין שגיאות — כל הצוותים מכוסים ויש מספיק רכבים</div>';
    return;
  }

  let html='<div class="err-wrap">';
  issues.forEach((iss,idx)=>{
    const cls=iss.severity==='error'?'sev-error':'sev-warning';
    const icon=iss.severity==='error'?'🔴':'⚠️';
    html+=`<div class="err-item ${cls}" id="ei_${idx}">
      <div class="err-header">
        <span class="err-icon">${icon}</span>
        <span class="err-msg">${iss.message}</span>
      </div>
      <div class="err-actions">`;

    if(iss.approvable)
      html+=`<button class="btn btn-ghost btn-sm" onclick="approveGap('${iss.key}',${idx})">✅ אשר חריגה</button>`;

    if(iss.fix_type==='add_cars')
      html+=`<button class="btn btn-green btn-sm" onclick="fixAddCars(${idx},'${iss.key}',${iss.fix_data.extra_cars})">🚗 הוסף ${iss.fix_data.extra_cars} רכבים אוטומטית</button>`;

    if(iss.fix_type==='add_person'||iss.fix_type==='extend_or_add')
      html+=`<button class="btn btn-primary btn-sm" onclick="toggleFix(${idx})">💡 הצע פתרון</button>`;

    if(iss.fix_type==='car_balance_info')
      html+=`<button class="btn btn-amber btn-sm" onclick="fixCarBalance(${idx},${iss.fix_data.needed})">🔄 הגדר ${iss.fix_data.needed} רכבים</button>`;

    html+=`</div>`;

    // Fix panel
    if(iss.fix_type==='add_person'){
      const cands=(iss.fix_data.candidates||[]).map(c=>`<button class="cand-btn" onclick="selectCand(${idx},'${c.replace(/'/g,"\\'")}')">${c}</button>`).join('');
      html+=`<div class="fix-panel" id="fp_${idx}">
        <label>הזן שם מלא של אדם מצוות "${iss.fix_data.team}" לתאריך ${iss.fix_data.date}:</label>
        <input id="fixInput_${idx}" placeholder="שם פרטי שם משפחה" onkeydown="if(event.key==='Enter')doFix(${idx})">
        ${cands?`<div style="font-size:11px;color:rgba(255,255,255,.3);margin-top:7px;margin-bottom:4px">אנשים מצוות זה ברשימה:</div><div class="candidates">${cands}</div>`:''}
        <div style="margin-top:8px;display:flex;gap:7px">
          <button class="btn btn-primary btn-sm" onclick="doFix(${idx})">✅ הוסף אוטומטית</button>
        </div>
        <div class="fix-result" id="fr_${idx}"></div>
      </div>`;
    }

    if(iss.fix_type==='extend_or_add'){
      const cands=(iss.fix_data.candidates||[]).map(c=>`<button class="cand-btn" onclick="selectCand(${idx},'${c.replace(/'/g,"\\'")}')">${c}</button>`).join('');
      html+=`<div class="fix-panel" id="fp_${idx}">
        <label>הוסף אדם מצוות "${iss.fix_data.team}" מ-${iss.fix_data.next_day}:</label>
        <input id="fixInput_${idx}" placeholder="שם פרטי שם משפחה" onkeydown="if(event.key==='Enter')doFix(${idx})">
        ${cands?`<div style="font-size:11px;color:rgba(255,255,255,.3);margin-top:7px;margin-bottom:4px">אנשים מצוות זה ברשימה:</div><div class="candidates">${cands}</div>`:''}
        <div style="margin-top:8px"><button class="btn btn-primary btn-sm" onclick="doFix(${idx})">✅ הוסף אוטומטית</button></div>
        <div class="fix-result" id="fr_${idx}"></div>
      </div>`;
    }

    html+='</div>';
  });
  html+='</div>';
  document.getElementById('mainArea').innerHTML=html;
}

function toggleFix(idx){const fp=document.getElementById('fp_'+idx);if(fp){fp.classList.toggle('show');if(fp.classList.contains('show')){const inp=document.getElementById('fixInput_'+idx);if(inp)inp.focus();}}}
function selectCand(idx,name){const inp=document.getElementById('fixInput_'+idx);if(inp)inp.value=name;}

async function approveGap(key,idx){
  await fetch('/api/lists/'+LID+'/gaps/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});
  const el=document.getElementById('ei_'+idx);
  if(el){el.style.opacity='.4';el.style.pointerEvents='none';}
  currentIssues=currentIssues.filter((_,i)=>i!==idx);
  renderTabs();
}

async function fixAddCars(idx,key,extra){
  const r=await fetch('/api/lists/'+LID+'/fix',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fix_type:'add_cars',fix_data:{extra_cars:extra}})});
  const j=await r.json();
  if(j.ok){lstConfig.car_count=j.new_car_count;toast('✅ '+j.message);await showErrors();}
}

async function fixCarBalance(idx,needed){
  const r=await fetch('/api/lists/'+LID+'/fix',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fix_type:'add_cars',fix_data:{extra_cars:needed-lstConfig.car_count}})});
  const j=await r.json();
  if(j.ok){lstConfig.car_count=j.new_car_count;toast('✅ '+j.message);await showErrors();}
}

async function doFix(idx){
  const iss=currentIssues[idx]; if(!iss) return;
  const inp=document.getElementById('fixInput_'+idx);
  const full_name=inp?inp.value.trim():'';
  if(!full_name){inp&&inp.focus();return;}
  const payload={fix_type:iss.fix_type,fix_data:{...iss.fix_data,full_name,action:'add'}};
  const r=await fetch('/api/lists/'+LID+'/fix',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const j=await r.json();
  if(j.ok){
    const fr=document.getElementById('fr_'+idx);
    if(fr){fr.textContent='✅ '+j.message;fr.style.display='block';}
    await loadRows();
    setTimeout(()=>showErrors(),1200);
  } else toast('❌ '+(j.error||'שגיאה'));
}

// ── CAR VIEW ───────────────────────────────────────────────────────────────────
async function showCarView(){
  document.getElementById('mainArea').innerHTML='<div style="text-align:center;padding:30px;color:rgba(255,255,255,.3);font-size:12px">⏳ טוען...</div>';
  const r=await fetch('/api/lists/'+LID+'/car-view');
  carViewData=await r.json(); renderCarView();
}

function fmtDate(d){if(!d)return '';const p=d.split('-');return p.length===3?`${p[2]}/${p[1]}`:d;}

function renderPassengers(people, capacity, driver){
  let html='<div class="cv-seats">';
  people.forEach(person=>{
    const isDrv=driver&&driver===person;
    html+=`<div class="cv-seat ${isDrv?'driver':''}">
      <span>${isDrv?'🧑‍✈️':'🧑'}</span><span class="sname">${person}</span>
      ${isDrv?'<span class="dbadge">נהג</span>':''}
    </div>`;
  });
  for(let i=people.length;i<capacity;i++)
    html+=`<div class="cv-seat empty"><span>💺</span><span class="sname">פנוי</span></div>`;
  html+='</div>';
  return html;
}

function renderCarView(){
  const d=carViewData;
  const area=document.getElementById('mainArea');
  let html='';

  // ── 3-step buttons always at TOP ──────────────────────────────────────────
  if(IS_ADMIN) html+=`
    <div class="assign-steps">
      <button class="btn btn-step" onclick="assignStep1()">
        <span class="step-num">1</span>
        <span>שיבוץ אחיד<small>הלוך+חזור ביחד</small></span>
      </button>
      <span class="step-arrow">←</span>
      <button class="btn btn-step" onclick="assignStep2()">
        <span class="step-num">2</span>
        <span>שיבוץ הלוך<small>לפי תאריך הגעה</small></span>
      </button>
      <span class="step-arrow">←</span>
      <button class="btn btn-step" onclick="assignStep3()">
        <span class="step-num">3</span>
        <span>שיבוץ חזור<small>לפי תאריך חזרה</small></span>
      </button>
      <button class="btn btn-danger btn-sm" style="margin-right:auto" onclick="assignReset()">🗑 אפס הכל</button>
      <button class="btn btn-ghost btn-sm" onclick="checkDates()">🔍 בדוק תאריכים</button>
    </div>`;

  if(d.recommendation&&d.recommendation.length)
    html+=`<div class="cv-rec">⚠️ ${d.recommendation.join(' · ')}</div>`;
  else if(d.total_arrive>0||d.total_return>0)
    html+=`<div class="cv-ok">✅ ${d.total_arrive} בהגעה · ${d.total_return} בחזרה</div>`;

  // Collect all car names from both directions
  const allNames=new Set([...Object.keys(d.cars_arrive||{}),...Object.keys(d.cars_return||{})]);
  const carKeys=[...allNames].sort((a,b)=>{
    const na=parseInt(a.replace(/\D/g,'')||0),nb=parseInt(b.replace(/\D/g,'')||0);
    return na-nb;
  });

  html+=`<div class="cv-cars-combined">`;
  carKeys.forEach(cname=>{
    const carA=d.cars_arrive[cname]||{people:[],driver:'',capacity:d.car_capacity,free:d.car_capacity};
    const carR=d.cars_return[cname]||{people:[],driver:'',capacity:d.car_capacity,free:d.car_capacity};
    const driver=carA.driver||carR.driver||'';
    const enc=s=>String(s||'').replace(/'/g,"\\'");

    let driverHtml='';
    if(driver){
      driverHtml=`<span class="cv-driver-badge">🧑‍✈️ ${driver}
        ${IS_ADMIN?`<button class="rm-drv" onclick="setDriver('${enc(cname)}','${enc(driver)}',true)" title="הסר נהג">×</button>`:''}
      </span>`;
    } else if(IS_ADMIN){
      driverHtml=`<button class="cv-add-driver" onclick="promptDriver(this,'${enc(cname)}')">+ נהג</button>`;
    } else {
      driverHtml=`<span style="font-size:10px;color:rgba(255,255,255,.2)">אין נהג</span>`;
    }

    html+=`<div class="cv-car-combined ${driver?'has-driver':''}">
      <div class="cv-car-header">
        <span class="cv-car-name">🚗 ${cname}</span>
        <div class="cv-driver-row">${driverHtml}</div>
      </div>
      <div class="cv-dirs">
        <div class="cv-dir-col">
          <div class="cv-dir-label">✈️ הגעה ${carA.date?`<span class="cv-date-badge">${fmtDate(carA.date)}</span>`:''} <span class="cv-dir-count">${carA.people.length}/${carA.capacity}</span></div>
          ${renderPassengers(carA.people,carA.capacity,driver)}
        </div>
        <div class="cv-dir-col">
          <div class="cv-dir-label">🏠 חזרה ${carR.date?`<span class="cv-date-badge">${fmtDate(carR.date)}</span>`:''} <span class="cv-dir-count">${carR.people.length}/${carR.capacity}</span></div>
          ${renderPassengers(carR.people,carR.capacity,driver)}
        </div>
      </div>
    </div>`;
  });
  html+=`</div>`;

  // Unassigned
  const unA=d.unassigned_arrive||[], unR=d.unassigned_return||[];
  if(unA.length||unR.length){
    html+=`<div class="cv-unassigned">`;
    if(unA.length) html+=`<h4 style="margin-bottom:5px">⚠️ ${unA.length} ללא שיבוץ הגעה</h4><div class="cv-tags">${unA.map(p=>`<span class="cv-ptag">${p}</span>`).join('')}</div>`;
    if(unA.length&&unR.length) html+=`<div style="margin:8px 0;border-top:1px solid rgba(255,255,255,.06)"></div>`;
    if(unR.length) html+=`<h4 style="margin-bottom:5px">⚠️ ${unR.length} ללא שיבוץ חזרה</h4><div class="cv-tags">${unR.map(p=>`<span class="cv-ptag">${p}</span>`).join('')}</div>`;
    html+=`</div>`;
  }

  if(IS_ADMIN) html+=`
    <div class="assign-steps">
      <button class="btn btn-step" onclick="assignStep1()">
        <span class="step-num">1</span>
        <span>שיבוץ אחיד<small>הלוך+חזור ביחד</small></span>
      </button>
      <span class="step-arrow">←</span>
      <button class="btn btn-step" onclick="assignStep2()">
        <span class="step-num">2</span>
        <span>שיבוץ הלוך<small>לפי תאריך הגעה</small></span>
      </button>
      <span class="step-arrow">←</span>
      <button class="btn btn-step" onclick="assignStep3()">
        <span class="step-num">3</span>
        <span>שיבוץ חזור<small>לפי תאריך חזרה</small></span>
      </button>
      <button class="btn btn-danger btn-sm" style="margin-right:auto" onclick="assignReset()">🗑 אפס הכל</button>
    </div>`;

  area.innerHTML=html;
}

function promptDriver(btn, cname){
  const inp=document.createElement('input');
  inp.className='cv-driver-inp'; inp.placeholder='שם הנהג...';
  btn.replaceWith(inp); inp.focus();
  const commit=()=>{const v=inp.value.trim();if(v)setDriver(cname,v,false);else showCarView();};
  inp.onkeydown=e=>{if(e.key==='Enter')commit();if(e.key==='Escape')showCarView();};
  inp.onblur=()=>setTimeout(()=>{if(document.activeElement!==inp)commit();},150);
}

async function setDriver(car,person,isCurrent){
  await fetch('/api/lists/'+LID+'/car-driver',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({car_name:car,driver:isCurrent?'':person})});
  await showCarView();
}

// ── CHANGELOG ─────────────────────────────────────────────────────────────────
async function showLog(){
  document.getElementById('mainArea').innerHTML='<div style="text-align:center;padding:30px;color:rgba(255,255,255,.3);font-size:12px">⏳ טוען...</div>';
  const r=await fetch('/api/lists/'+LID+'/changelog'); const logs=await r.json();
  if(!logs.length){document.getElementById('mainArea').innerHTML='<div style="text-align:center;padding:36px;color:rgba(255,255,255,.22);font-size:12px">אין שינויים</div>';return;}
  let html='<div class="lw">';
  logs.forEach(l=>{
    let dc='d-e';
    if(l.action==='אושר'||l.action==='בוטל אישור')dc='d-c';
    else if(l.action==='נמחקה שורה')dc='d-d';
    else if(l.action==='נוצרה שורה')dc='d-a';
    else if(l.action&&l.action.includes('רכב'))dc='d-car';
    let at='';
    if(l.action==='עדכון'&&l.field_name)
      at=`<div class="la">${l.done_by||'?'} עדכן <strong>${l.field_name}</strong></div><div class="ldt">${l.old_value||'(ריק)'} → ${l.new_value||'(ריק)'}</div>`;
    else at=`<div class="la">${l.done_by||'?'} — ${l.action||''}</div>`;
    html+=`<div class="li"><div class="ld ${dc}"></div><div class="lb">${at}</div><div class="lt">${(l.created_at||'').replace('T',' ').slice(0,16)}</div></div>`;
  });
  document.getElementById('mainArea').innerHTML=html+'</div>';
}

// ── IMPORT MODAL ───────────────────────────────────────────────────────────────
let xlFileObj=null, xlSelSheet='';
function xlDragOver(e){e.preventDefault();document.getElementById('xlDrop').classList.add('drag-over');}
function xlDragLeave(){document.getElementById('xlDrop').classList.remove('drag-over');}
function xlDropped(e){e.preventDefault();document.getElementById('xlDrop').classList.remove('drag-over');if(e.dataTransfer.files[0])xlFileChosen({files:e.dataTransfer.files});}
async function xlFileChosen(inp){
  const file=inp.files[0]; if(!file)return; xlFileObj=file;
  document.getElementById('xlDrop').querySelector('strong').textContent='⏳ קורא...';
  const form=new FormData(); form.append('file',file);
  const r=await fetch('/api/lists/'+LID+'/excel-preview',{method:'POST',body:form});
  const j=await r.json();
  if(j.error){alert('❌ '+j.error);return;}
  document.getElementById('xlFName').textContent='📄 '+file.name;
  document.getElementById('xlS1').style.display='none';
  document.getElementById('xlS2').style.display='';
  const sh=document.getElementById('xlSheets'); sh.innerHTML='';
  j.sheets.forEach((s,i)=>{
    const c=document.createElement('div'); c.className='sheet-card'+(i===0?' sel':''); c.dataset.sh=s.name;
    c.innerHTML=`<h4>${s.name}</h4><p>${s.total} שורות</p><div class="col-preview">${s.headers.slice(0,6).map(h=>`<span class="col-chip">${h}</span>`).join('')}</div>`;
    c.onclick=()=>{sh.querySelectorAll('.sheet-card').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');xlSelSheet=s.name;};
    sh.appendChild(c);
  });
  xlSelSheet=j.sheets[0]?.name||'';
  document.getElementById('xlBtn').style.display='';
}
async function xlImport(){
  if(!xlFileObj)return;
  document.getElementById('xlBtn').textContent='⏳ מייבא...'; document.getElementById('xlBtn').disabled=true;
  const form=new FormData(); form.append('file',xlFileObj); form.append('sheet',xlSelSheet);
  const r=await fetch('/api/lists/'+LID+'/import',{method:'POST',body:form});
  const j=await r.json();
  document.getElementById('xlS2').style.display='none'; document.getElementById('xlS3').style.display='';
  if(j.ok){
    document.getElementById('xlResult').textContent=`✅ יובאו ${j.imported} שורות`;
    if(j.suggestions&&j.suggestions.applied){lstConfig.teams=j.suggestions.teams||lstConfig.teams;lstConfig.trial_start=j.suggestions.trial_start;lstConfig.trial_end=j.suggestions.trial_end;lstConfig.car_count=j.suggestions.car_count;}
    await loadRows(); renderTable();
  } else document.getElementById('xlResult').textContent='❌ '+(j.error||'שגיאה');
  document.getElementById('xlBtn').style.display='none';
  document.querySelector('#xlMo .btn-ghost').textContent='סגור';
}

function op(id){document.getElementById(id).classList.add('on')}
function cl(id){document.getElementById(id).classList.remove('on')}
document.querySelectorAll('.mo').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('on')}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.mo.on').forEach(m=>m.classList.remove('on'))});

init();
</script>
